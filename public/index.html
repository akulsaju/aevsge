<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cryptographic Singularity — Mesh Ledger Demo</title>
<style>
  :root { color-scheme: dark; --bg:#0b0f17; --card:#131a26; --fg:#e6edf3; --mut:#8b98a9; --ok:#3fb950; --bad:#f85149; --acc:#58a6ff; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:20px 24px 0; }
  h1 { margin:0; font-size:22px; } p.sub { margin:4px 0 0; color:var(--mut); }
  main { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:16px; padding:16px 24px 24px; }
  @media (max-width:900px){ main{grid-template-columns:1fr;} }
  .card { background:var(--card); border:1px solid #232d3d; border-radius:10px; padding:14px; }
  canvas { width:100%; height:auto; background:#0e1420; border-radius:8px; display:block; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px; }
  button { background:#1f2a3c; color:var(--fg); border:1px solid #2d3b52; border-radius:6px; padding:6px 12px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--acc); } button.on { background:var(--acc); color:#04111f; }
  select, input[type=number] { background:#0e1420; color:var(--fg); border:1px solid #2d3b52; border-radius:6px; padding:5px; font:inherit; }
  input[type=range] { width:160px; }
  table { width:100%; border-collapse:collapse; } th,td { text-align:right; padding:3px 6px; border-bottom:1px solid #232d3d; }
  th:first-child,td:first-child { text-align:left; }
  td.diff { color:var(--bad); }
  #log { height:220px; overflow:auto; font:12px ui-monospace,Consolas,monospace; color:var(--mut); }
  #log .ok{color:var(--ok)} #log .bad{color:var(--bad)} #log .info{color:var(--acc)}
  h2 { font-size:13px; margin:0 0 8px; color:var(--mut); text-transform:uppercase; letter-spacing:.05em; }
  .pill { padding:2px 8px; border-radius:99px; font-weight:600; }
</style>
</head>
<body>
<header>
  <h1>⏱ Cryptographic Singularity — Mesh Ledger</h1>
  <p class="sub">Gossip mesh · proof verification stub · CRDT (LWW + Lamport) convergence · chaos &amp; Sybil testing. Runs entirely in your browser.</p>
</header>
<main>
  <section class="card">
    <canvas id="c" width="720" height="460"></canvas>
    <div class="row">
      <label>Packet drop <input id="drop" type="range" min="0" max="95" value="80"> <b id="dropv">80%</b></label>
      <button id="part">Partition: off</button>
      <button id="sybil">Inject Sybil</button>
      <label><input type="checkbox" id="trust" checked> Trusted-writer filter</label>
    </div>
    <div class="row">
      Transfer at
      <select id="at"></select>
      <select id="from"><option>alice</option><option>bob</option></select> →
      <select id="to"><option>bob</option><option>alice</option></select>
      <input id="amt" type="number" min="1" value="25" style="width:70px">
      <button id="send">Send</button>
      <button id="bad">Send forged proof</button>
      <button id="reset">Reset</button>
    </div>
  </section>
  <section>
    <div class="card"><h2>Status <span id="status" class="pill"></span></h2>
      <table id="tbl"></table></div>
    <div class="card" style="margin-top:16px"><h2>Event log</h2><div id="log"></div></div>
  </section>
</main>
<script>
"use strict";
async function sha256(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
const proofHash=(s,r,a,n)=>sha256(`${s}|${r}|${a}|${n}`);

class Node {
  constructor(id,x,y){this.id=id;this.x=x;this.y=y;this.reset();}
  reset(){this.ledger={alice:[500,0,""],bob:[100,0,""]};this.clock={[this.id]:0};this.lamport=0;this.seen=new Set();}
  state(){const o={};for(const k in this.ledger)o[k]=this.ledger[k][0];return o;}
  async verify(p){
    if(!p||typeof p!=="object")return false;
    const {sender:s,receiver:r,amount:a,nonce:n,proof_hash:h}=p;
    if(typeof s!=="string"||typeof r!=="string"||typeof h!=="string")return false;
    if(!Number.isInteger(a)||!Number.isInteger(n)||a<=0||s===r||this.seen.has(n))return false;
    return h===await proofHash(s,r,a,n);
  }
  async transfer(p){
    if(!await this.verify(p))return "rejected: invalid proof";
    if((this.ledger[p.sender]?.[0]??0)<p.amount)return "rejected: insufficient funds";
    this.seen.add(p.nonce);this.clock[this.id]=(this.clock[this.id]||0)+1;this.lamport++;
    for(const [acct,d] of [[p.sender,-p.amount],[p.receiver,p.amount]]){
      const cur=this.ledger[acct]?.[0]??0;this.ledger[acct]=[cur+d,this.lamport,this.id];}
    return "ok";
  }
  merge(msg,trusted){
    for(const n in msg.clock) if(!trusted||trusted.has(n)) this.clock[n]=Math.max(this.clock[n]||0,msg.clock[n]);
    for(const u in msg.state){
      const [bal,ts,w]=msg.state[u];
      if(trusted&&w&&!trusted.has(w))continue;
      const cur=this.ledger[u];
      if(!cur||ts>cur[1]||(ts===cur[1]&&w>cur[2]))this.ledger[u]=[bal,ts,w];
      this.lamport=Math.max(this.lamport,ts);
    }
  }
}

const IDS=["n1","n2","n3","n4","n5"], TRUSTED=new Set(IDS);
const cv=document.getElementById("c"), ctx=cv.getContext("2d");
const nodes=IDS.map((id,i)=>{const a=-Math.PI/2+i*2*Math.PI/IDS.length;return new Node(id,360+Math.cos(a)*170,230+Math.sin(a)*160);});
let packets=[], partition=false;
const $=id=>document.getElementById(id);
$("at").innerHTML=IDS.map(i=>`<option>${i}</option>`).join("");
const groupOf=n=>nodes.indexOf(n)<2?0:1;
const linked=(a,b)=>!partition||groupOf(a)===groupOf(b);
const dropRate=()=>$("drop").value/100;

function log(msg,cls=""){const d=document.createElement("div");d.className=cls;d.textContent=`${new Date().toLocaleTimeString()}  ${msg}`;$("log").prepend(d);while($("log").children.length>150)$("log").lastChild.remove();}

function send(from,to,msg){
  if(Math.random()<dropRate()){packets.push({from,to,t:0,dead:true});return;}
  packets.push({from,to,t:0,msg});
}
function gossip(){
  for(const a of nodes){
    const msg={clock:{...a.clock},state:JSON.parse(JSON.stringify(a.ledger))};
    for(const b of nodes) if(a!==b&&linked(a,b)) send(a,b,msg);
  }
}
setInterval(gossip,800);

function step(){
  for(const p of packets){
    p.t+=p.dead?0.025:0.03;
    if(!p.dead&&p.t>=1&&!p.done){p.done=true;p.to.merge(p.msg,$("trust").checked?TRUSTED:null);}
    if(p.dead&&p.t>=0.5)p.done=true;
  }
  packets=packets.filter(p=>!p.done);
}

function converged(){return new Set(nodes.map(n=>JSON.stringify(n.state()))).size===1;}

function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
    const ok=linked(nodes[i],nodes[j]);
    ctx.strokeStyle=ok?"#243047":"#3a1d22";ctx.setLineDash(ok?[]:[4,6]);
    ctx.beginPath();ctx.moveTo(nodes[i].x,nodes[i].y);ctx.lineTo(nodes[j].x,nodes[j].y);ctx.stroke();
  }
  ctx.setLineDash([]);
  for(const p of packets){
    const x=p.from.x+(p.to.x-p.from.x)*p.t,y=p.from.y+(p.to.y-p.from.y)*p.t;
    ctx.fillStyle=p.dead?"#f85149":p.from.id==="sybil"?"#d29922":"#58a6ff";ctx.globalAlpha=p.dead?Math.max(0,1-p.t*2):1;
    ctx.beginPath();ctx.arc(x,y,p.dead?3:4,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;
  for(const n of nodes){
    ctx.fillStyle="#131a26";ctx.strokeStyle=partition&&groupOf(n)?"#d29922":"#58a6ff";ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(n.x,n.y,30,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle="#e6edf3";ctx.font="bold 13px system-ui";ctx.textAlign="center";
    ctx.fillText(n.id,n.x,n.y-2);ctx.font="11px system-ui";ctx.fillStyle="#8b98a9";
    ctx.fillText(`${n.ledger.alice[0]} / ${n.ledger.bob[0]}`,n.x,n.y+12);
  }
}

function table(){
  const ok=converged(), st=$("status");
  st.textContent=ok?"converged":"diverged";st.style.background=ok?"#12361c":"#3d1a1d";st.style.color=ok?"var(--ok)":"var(--bad)";
  const ref=nodes[0].state();
  $("tbl").innerHTML="<tr><th>Node</th><th>alice</th><th>bob</th><th>lamport</th></tr>"+nodes.map(n=>{
    const s=n.state();
    return `<tr><td>${n.id}</td><td class="${s.alice!==ref.alice?"diff":""}">${s.alice}</td><td class="${s.bob!==ref.bob?"diff":""}">${s.bob}</td><td>${n.lamport}</td></tr>`;}).join("");
}

(function loop(){step();draw();table();requestAnimationFrame(loop);})();

const byId=id=>nodes.find(n=>n.id===id);
async function makeProof(s,r,a,forge){
  const nonce=Math.floor(Math.random()*2**48);
  return {sender:s,receiver:r,amount:a,nonce,proof_hash:forge?"0".repeat(64):await proofHash(s,r,a,nonce)};
}
async function doSend(forge){
  const n=byId($("at").value),s=$("from").value,r=$("to").value,a=parseInt($("amt").value,10);
  const res=await n.transfer(await makeProof(s,r,a,forge));
  log(`${n.id}: ${s}→${r} ${a}${forge?" (forged proof)":""} — ${res}`,res==="ok"?"ok":"bad");
}
$("send").onclick=()=>doSend(false);
$("bad").onclick=()=>doSend(true);
$("drop").oninput=e=>{$("dropv").textContent=e.target.value+"%";};
$("part").onclick=e=>{partition=!partition;e.target.textContent="Partition: "+(partition?"on":"off");e.target.classList.toggle("on",partition);log(partition?"Network partitioned: {n1,n2} | {n3,n4,n5}":"Partition healed — reconciling","info");};
$("sybil").onclick=()=>{
  const msg={clock:{sybil:99},state:{alice:[1e9,1e6,"sybil"]}};
  const fake={id:"sybil",x:360,y:10};
  for(const n of nodes)for(let i=0;i<3;i++)packets.push({from:fake,to:n,t:0,msg});
  log($("trust").checked?"Sybil flood sent — rejected (untrusted writer)":"Sybil flood sent — filter OFF, ledger poisoned!",$("trust").checked?"info":"bad");
};
$("reset").onclick=()=>{nodes.forEach(n=>n.reset());packets=[];log("Reset","info");};
log("Mesh online. 80% packet loss active.","info");
</script>
</body>
</html>
