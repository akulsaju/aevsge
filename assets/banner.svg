    <circle cx="210" cy="190" r="7" fill="#2bff9a"><animate attributeName="r" values="5;10;5" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="70" r="7" fill="#ffb000"><animate attributeName="r" values="5;10;5" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="200" r="7" fill="#b84dff"><animate attributeName="r" values="5;10;5" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="60" r="7" fill="#00e5ff"><animate attributeName="r" values="5;10;5" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="210" r="7" fill="#ff3b5c"><animate attributeName="r" values="5;10;5" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="80" r="7" fill="#2bff9a"><animate attributeName="r" values="5;10;5" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="190" r="7" fill="#ffb000"><animate attributeName="r" values="5;10;5" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="60" r="7" fill="#00e5ff"><animate attributeName="r" values="5;10;5" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle r="4" fill="#fff"><animateMotion dur="5s" repeatCount="indefinite" path="M90 80L210 190L330 70L470 200L600 60L760 210L900 80L1040 190L1120 60"/></circle>
