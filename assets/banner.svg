      <stop offset="1" stop-color="#b84dff"><animate attributeName="stop-color" values="#b84dff;#00e5ff;#2bff9a;#ffb000;#ff3b5c;#b84dff" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
